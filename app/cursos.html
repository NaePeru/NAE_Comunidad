<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cursos — Proyecto Z</title>
  <link rel="icon" type="image/png" href="../assets/img/favicon.png">

  <!-- App Móvil (PWA) -->
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0B0F19">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NAE">
  <link rel="apple-touch-icon" href="../assets/img/icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/css/base.css?v=20240710v1">
  <link rel="stylesheet" href="../assets/css/components.css?v=20240710v1">
  <link rel="stylesheet" href="../assets/css/layout.css?v=20240710v1">
  <link rel="stylesheet" href="../assets/css/gamificacion.css?v=20240710v1">
  <link rel="stylesheet" href="../assets/css/cursos.css?v=20240710v1">

  <!-- Red de seguridad: captura errores antes que cualquier otro JS -->
  <script src="../assets/js/error-guard.js"></script>
</head>
<body>

  <!-- ════════ VISTA CATÁLOGO ════════ -->
  <div id="vista-catalogo">
    <div class="container courses-page" style="max-width:840px;margin-top:24px;">
      <div class="page-header">
        <h1 class="page-title">Cursos 📚</h1>
        <p class="page-sub">Aprende a tu ritmo. Empieza gratis y avanza cuando estés listo.</p>
      </div>

      <div class="course-filters">
        <button class="pill active" onclick="filtrarCursos('todo', this)">Todo</button>
        <button class="pill" onclick="filtrarCursos('gratis', this)">🎁 Gratis</button>
        <button class="pill" onclick="filtrarCursos('excel', this)">📊 Excel</button>
        <button class="pill" onclick="filtrarCursos('powerbi', this)">⚡ Power BI</button>
      </div>

      <!-- 🔴 CURSOS EN VIVO (matrícula con Alessandra) -->
      <div id="live-wrap" style="display:none;margin-bottom:24px;">
        <span style="font-size:11px;font-weight:800;color:#FF6B6B;letter-spacing:.1em;">🔴 CURSOS EN VIVO — MATRÍCULA ABIERTA</span>
        <div id="live-list" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:10px;"></div>
        <p style="font-size:12px;color:var(--muted2);margin-top:10px;">
          💬 Para matricularte: andá a la <a href="comunidad.html" style="color:var(--gold);">Comunidad</a>,
          tocá el chat de Alessandra (abajo a la derecha) y decile
          <b style="color:var(--gold);">"quiero matricularme en [código]"</b>
        </p>
      </div>

        <div id="courses-list" class="courses-grid">
          <div class="empty-state"><div class="empty-icon">⏳</div>Cargando cursos...</div>
        </div>
    </div>
  </div>

  <!-- ════════ VISTA CURSO (oculta por defecto) ════════ -->
  <div id="vista-curso" class="hidden">
    <div class="container" style="max-width:1400px;margin-top:24px;">
      <div id="curso-container">
        <div class="empty-state"><div class="empty-icon">⏳</div>Cargando curso...</div>
      </div>
    </div>
  </div>

  <div class="tabbar"></div>

  <script type="module">
    import { supabase } from '../assets/js/supabase-client.js';
    import { cargarPerfilCompleto, session } from '../assets/js/auth.js';
    import { renderNavbar } from '../assets/js/navbar.js?v=20260809';
    import { verificarAcceso } from '../assets/js/guard.js';
    import { cargarCatalogo, bindClicksCatalogo } from '../assets/js/cursos.js?v=20260809b';

    const { data: { session: sess } } = await supabase.auth.getSession();
    if (!sess) {
      window.location.href = '../index.html';
    } else {
      await cargarPerfilCompleto();
      inicializar();
    }

    async function inicializar() {
      renderNavbar('cursos');

      // Verificar acceso (pendiente, suspendido, etc.)
      if (!verificarAcceso()) return;

      await cargarCatalogo();
      bindClicksCatalogo();
      cargarCursosEnVivo();
    }

    // ── 🔴 Cursos EN VIVO programados (matrícula por chat) ──
    async function cargarCursosEnVivo() {
      try {
        const hoy = new Date().toLocaleDateString('en-CA');
        const { data: vivos } = await supabase.from('t_cursop')
          .select('cursop, horario, fecha_inicio, fecha_fin, t_cursos(nombre, costo), t_profesor(nombre)')
          .or(`fecha_fin.gte.${hoy},fecha_fin.is.null`)
          .order('fecha_inicio').limit(6);
        if (!vivos || vivos.length === 0) return;
        const fDMA = (iso) => {
          const [y, m, d] = String(iso).slice(0, 10).split('-');
          return `${d}-${m}-${y.slice(2)}`;
        };
        document.getElementById('live-wrap').style.display = 'block';
        document.getElementById('live-list').innerHTML = vivos.map(cp => `
          <div style="background:var(--card);border:1px solid rgba(255,107,107,.25);border-radius:14px;padding:14px;">
            <div style="display:flex;align-items:center;gap:10px;">
              <div style="font-size:22px;">${cp.t_cursos?.icono || '🎓'}</div>
              <div style="flex:1;min-width:0;">
                <div style="font-size:14px;font-weight:700;color:#fff;">${cp.t_cursos?.nombre || ''}</div>
                <div style="font-size:12px;color:var(--muted);">Prof. ${cp.t_profesor?.nombre || ''} · S/ ${cp.t_cursos?.costo ?? 50}</div>
              </div>
              <span style="font-family:var(--font-mono);font-size:11px;color:var(--gold);">[${cp.cursop}]</span>
            </div>
            <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted);">
              <span>🕐 ${cp.horario || 'Por confirmar'}</span>
              <span>📅 ${fDMA(cp.fecha_inicio)}${cp.fecha_fin ? ' al ' + fDMA(cp.fecha_fin) : ''}</span>
            </div>
            <a href="comunidad.html" class="btn btn-primary btn-sm btn-block" style="margin-top:10px;text-decoration:none;display:block;">
              💬 Matricularme con Alessandra (Comunidad)
            </a>
          </div>`).join('');
      } catch (e) { /* sin sección si falla */ }
    }

    function filtrarCursos(filtro, btn) {
      document.querySelectorAll('#vista-catalogo .pill').forEach(p => p.classList.remove('active'));
      if (btn) btn.classList.add('active');
      document.querySelectorAll('.course-card').forEach(c => {
        const cat = c.dataset.categoria;
        const gratis = c.dataset.gratis;
        let mostrar = true;
        if (filtro === 'todo') mostrar = true;
        else if (filtro === 'gratis') mostrar = (gratis === 'si');
        else mostrar = (cat === filtro);
        c.style.display = mostrar ? 'flex' : 'none';
      });
    }
    window.filtrarCursos = filtrarCursos;
  </script>
</body>
</html>

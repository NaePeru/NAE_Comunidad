<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comunidad — Proyecto Z</title>
  <link rel="icon" type="image/png" href="../assets/img/favicon.png">

  <!-- App Móvil (PWA) -->
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0B0F19">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NAE">
  <link rel="apple-touch-icon" href="../assets/img/icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/css/base.css?v=20240710v1">
  <link rel="stylesheet" href="../assets/css/components.css?v=20240710v1">
  <link rel="stylesheet" href="../assets/css/layout.css?v=20240710v1">
  <link rel="stylesheet" href="../assets/css/gamificacion.css?v=20240710v1">
  <link rel="stylesheet" href="../assets/css/comunidad.css?v=20240714v1">

  <!-- Red de seguridad: captura errores antes que cualquier otro JS -->
  <script src="../assets/js/error-guard.js"></script>
</head>
<body>

      <div class="container" style="max-width:1000px;margin-top:24px;">

        <div class="community-layout">

        <!-- COLUMNA PRINCIPAL: Feed -->
        <div style="min-width:0;">

        <div class="page-header">
          <h1 class="page-title">Comunidad 💬</h1>
          <p class="page-sub">Comparte avances, resuelve dudas y motívate.</p>
        </div>

        <!-- COMPOSER (caja para crear post) -->
        <div class="composer" id="composer">
          <textarea id="composer-text" placeholder="Escribí algo..."></textarea>
          
          <!-- Preview de imagen -->
          <div id="image-preview" style="display:none; margin-top:8px; padding:8px; background:var(--bg); border:1px solid var(--border); border-radius:8px;">
            <img id="preview-img" src="" style="max-width:100%; max-height:200px; border-radius:6px;">
            <button onclick="window.__quitarImagen()" style="display:block; margin-top:6px; color:var(--red); background:none; border:none; cursor:pointer; font-size:12px;">❌ Quitar imagen</button>
          </div>

          <div class="composer-footer" id="composer-footer">
            <input type="file" id="image-input" accept="image/*" style="display:none;" onchange="window.__manejarImagen(event)">
            <button type="button" class="composer-tool" onclick="document.getElementById('image-input').click()" title="Adjuntar imagen">🖼️</button>
            <button type="button" class="btn btn-live" id="live-btn" onclick="toggleLive()">
              🔴 LIVE
            </button>
            <button class="btn btn-primary" id="composer-btn" onclick="publicar()">
              Publicar →
            </button>
          </div>
        </div>

        <!-- FILTROS -->
        <div style="display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;">
          <button class="pill active" onclick="filtrarCat('general', this)">💬 General</button>
          <button class="pill" onclick="filtrarCat('excel', this)">📊 Excel</button>
          <button class="pill" onclick="filtrarCat('powerbi', this)">⚡ Power BI</button>
          <button class="pill" onclick="filtrarCat('ia', this)">🤖 IA</button>
        </div>

        <!-- FEED -->
        <div id="feed-list">
          <div class="empty-state"><div class="empty-icon">⏳</div>Cargando publicaciones...</div>
        </div>

        </div>

        <!-- COLUMNA LATERAL: Panel de comunidad -->
        <aside class="community-panel">
          <div class="panel-card">
            <div class="panel-card-header">
              <div class="panel-card-icon">🎓</div>
              <div class="panel-card-title">Nae. Information</div>
            </div>
            <div class="panel-card-desc">
              Aprendé Excel, Power BI y SQL. Compartí conocimiento, ganá puntos y crecé como Analista de Datos junto a la comunidad.
            </div>
            <div class="panel-stats">
              <div>
                <div class="panel-stat-num" id="com-members">—</div>
                <div class="panel-stat-label">Miembros</div>
              </div>
              <div>
                <div class="panel-stat-num" id="com-online" style="color:var(--green);">0</div>
                <div class="panel-stat-label">En línea</div>
              </div>
            </div>
          </div>

          <div class="panel-card">
            <div class="panel-card-header">
              <div class="panel-card-icon">📡</div>
              <div class="panel-card-title">Próximo seminario</div>
            </div>
            <div class="panel-card-desc" id="com-next-event">
              Cargando...
            </div>
          </div>

          <div class="panel-card">
            <div class="panel-card-header">
              <div class="panel-card-icon">🏆</div>
              <div class="panel-card-title">Top de la semana</div>
            </div>
            <div id="com-top-week" style="font-size:13px;line-height:1.8;"></div>
          </div>
        </aside>

        </div>
      </div>

  <!-- Tabbar móvil (lo rellena navbar.js) -->
  <div class="tabbar"></div>

  <!-- Modal Visor Multimedia (Videos/Imágenes) -->
  <div id="media-viewer" class="media-viewer-overlay" onclick="if(event.target.id==='media-viewer') window.__closeViewer()">
    <div class="media-viewer-content">
      <button class="media-viewer-close" onclick="window.__closeViewer()">✕</button>
      <div id="media-viewer-body"></div>
    </div>
  </div>

  <!-- Librería de compresión de imágenes (carga diferida: solo cuando se necesita) -->
  <script>
    window.__loadImageCompression = function() {
      if (window.imageCompression) return Promise.resolve();
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.min.js';
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });
    };
  </script>

  <script type="module">
    import { supabase } from '../assets/js/supabase-client.js';
    import { cargarPerfilCompleto, session } from '../assets/js/auth.js';
    import { toast } from '../assets/js/utils.js';
    import { renderNavbar } from '../assets/js/navbar.js?v=20260809';
    import { verificarAcceso } from '../assets/js/guard.js';
    import { cargarFeed, crearPost, filtrar, iniciarRealtime, detenerRealtime, getFiltroActual } from '../assets/js/comunidad.js?v=20260809';

    // ── Verificar sesión ──
    const { data: { session: sess } } = await supabase.auth.getSession();
    if (!sess) {
      window.location.href = '../index.html';
    } else {
      await cargarPerfilCompleto();
      inicializar();
    }

    async function inicializar() {
      // Verificar si el usuario está aprobado. Si no, bloquear pantalla.
      if (!verificarAcceso()) return;

      renderNavbar('comunidad');

      // Si es móvil, eliminar el panel lateral del HTML directamente (sin depender de CSS)
      if (window.innerWidth <= 900) {
        const panel = document.querySelector('.community-panel');
        if (panel) panel.remove();
        const layout = document.querySelector('.community-layout');
        if (layout) layout.style.gridTemplateColumns = '1fr';
        const header = document.querySelector('.page-header');
        if (header) header.style.display = 'none';
      }

      // Cargar feed + realtime (con manejo de errores)
      try {
        await cargarFeed();
      } catch (err) {
        console.error('Error cargando feed:', err);
        const list = document.getElementById('feed-list');
        if (list) {
          list.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">⚠️</div>
              <p style="font-size:15px; color:var(--text); margin-bottom:8px;">No se pudo cargar la comunidad</p>
              <p style="font-size:13px; color:var(--muted);">Tu sesión puede haber expirado. Probá recargar la página.</p>
              <button onclick="location.reload()" class="btn btn-primary" style="margin-top:16px;">🔄 Recargar</button>
            </div>`;
        }
      }

      try { iniciarRealtime(); } catch(e) { console.warn('Realtime no disponible:', e); }
      try { initPresence(); } catch(e) { console.warn('Presence no disponible:', e); }

      // Cargar panel lateral derecho (solo si existe en PC)
      try { cargarPanelComunidad(); } catch(e) { console.warn('Panel no disponible:', e); }

      // Refrescar navbar cuando cambian los puntos
      window.addEventListener('perfil-actualizado', () => {
        renderNavbar('comunidad');
      });

      // Limpieza al salir: evita fugas de WebSockets al navegar entre páginas.
      // pagehide cubre desktop (Chrome/Firefox) y móvil (iOS/Android), y también
      // funciona cuando el usuario envía la pestaña a segundo plano.
      window.addEventListener('pagehide', () => {
        detenerRealtime();
        detenerPresence();
      });
    }

    // ── Presence: Usuarios en línea ──
    let presenceChannel = null;
    function initPresence() {
      presenceChannel = supabase.channel('online-users', {
        config: { presence: { key: session.user.id } }
      });

      presenceChannel.on('presence', { event: 'sync' }, () => {
        const state = presenceChannel.presenceState();
        const count = Object.keys(state).length;
        const el = document.getElementById('com-online');
        if (el) el.textContent = count;
      });

      presenceChannel.subscribe(async (status) => {
        if (status === 'SUBSCRIBED') {
          await presenceChannel.track({ user_id: session.user.id, online_at: new Date().toISOString() });
        }
      });
    }

    // Limpieza del canal presence al salir (evita fuga de conexiones)
    function detenerPresence() {
      if (presenceChannel) {
        try { supabase.removeChannel(presenceChannel); } catch (e) { /* ya cerrado */ }
        presenceChannel = null;
      }
    }

    // ── Cargar datos del panel lateral ──
    async function cargarPanelComunidad() {
      // OPTIMIZACIÓN: las 3 queries son independientes → se lanzan en paralelo.
      // Antes se hacían secuenciales (3 viajes a la BD uno tras otro).
      const hoy = new Date().toISOString().split('T')[0];
      const [miembrosRes, eventosRes, topRes] = await Promise.all([
        supabase.from('profiles').select('id', { count: 'exact', head: true }),
        supabase.from('events').select('titulo, fecha, hora').gte('fecha', hoy).order('fecha').limit(1),
        supabase.from('leaderboard_semanal').select('nombre, puntos_semana').gt('puntos_semana', 0).order('posicion').limit(5),
      ]);

      // Total miembros
      const elM = document.getElementById('com-members');
      if (elM) elM.textContent = miembrosRes.count || 0;

      // NOTA: No sobrescribir #com-online aquí.
      // Ese ID lo controla initPresence() con el conteo de usuarios en vivo (realtime).

      // Próximo evento
      const eventos = eventosRes.data;
      const elE = document.getElementById('com-next-event');
      if (elE) {
        if (eventos && eventos.length > 0) {
          const e = eventos[0];
          const f = new Date(e.fecha + 'T00:00:00').toLocaleDateString('es-PE', { day:'numeric', month:'short' });
          elE.innerHTML = `📅 ${f}${e.hora ? ' · ' + e.hora.substring(0,5) : ''}<br><strong style="color:var(--gold);">${e.titulo}</strong>`;
        } else {
          elE.textContent = 'Próximamente anunciaremos el siguiente seminario. ¡Stay tuned!';
        }
      }

      // Top de la semana
      const top = topRes.data;
      const elT = document.getElementById('com-top-week');
      if (elT) {
        if (top && top.length > 0) {
          elT.innerHTML = top.map((u, i) => {
            const medal = ['🥇','🥈','🥉'][i] || `${i+1}.`;
            return `<div style="display:flex;justify-content:space-between;padding:3px 0;">${medal} ${u.nombre} <strong style="color:var(--gold);">${u.puntos_semana}</strong></div>`;
          }).join('');
        } else {
          elT.innerHTML = '<span style="color:var(--muted2);">Aún no hay actividad esta semana.</span>';
        }
      }
    }

    // ── Estado LIVE ──
    let liveActivo = false;
    let imagenPendiente = null; // File object comprimido

    // ── Manejo de imágenes en el composer (CON COMPRESIÓN) ──
    window.__manejarImagen = async (event) => {
      const file = event.target.files[0];
      if (!file) return;

      if (!file.type.startsWith('image/')) {
        toast('⚠️ Debe ser una imagen');
        return;
      }
      if (file.size > 10 * 1024 * 1024) { // Máx original 10MB
        toast('⚠️ La imagen pesa más de 10MB');
        return;
      }

      // Mostrar aviso de comprimiendo
      const btnImg = event.target.parentElement.querySelector('.composer-tool');
      if (btnImg) btnImg.innerHTML = '⏳';

      try {
        // Cargar librería de compresión bajo demanda (no bloquea el render inicial)
        await window.__loadImageCompression();
        // COMPRIMIR con la librería profesional (vía window porque estamos en un módulo ES)
        const compressedFile = await window.imageCompression(file, {
          maxSizeMB: 0.5,            // Máximo 500 KB
          maxWidthOrHeight: 1080,    // Máximo 1080px
          useWebWorker: true         // Hacerlo en segundo plano (no congela la web)
        });

        imagenPendiente = compressedFile;

        // Mostrar preview
        const previewUrl = URL.createObjectURL(compressedFile);
        const prev = document.getElementById('image-preview');
        const prevImg = document.getElementById('preview-img');
        if (prevImg) {
          prevImg.src = previewUrl;
          prev.style.display = 'block';
        }
      } catch (error) {
        console.error('Error compresión:', error);
        toast('⚠️ Error al procesar la imagen');
      } finally {
        if (btnImg) btnImg.innerHTML = '🖼️';
      }
    };

    window.__quitarImagen = () => {
      imagenPendiente = null;
      const prev = document.getElementById('image-preview');
      if (prev) prev.style.display = 'none';
      const input = document.getElementById('image-input');
      if (input) input.value = '';
    };
    function toggleLive() {
      liveActivo = !liveActivo;
      const btn = document.getElementById('live-btn');
      if (liveActivo) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    }
    window.toggleLive = toggleLive;

    // ── Expandir composer al hacer focus (móvil) ──
    const composerText = document.getElementById('composer-text');
    const composerEl = document.getElementById('composer');
    if (composerText && composerEl) {
      composerText.addEventListener('focus', () => composerEl.classList.add('expanded'));
      // Opcional: contraer si se hace click fuera y está vacío
      document.addEventListener('click', (e) => {
        if (!composerEl.contains(e.target) && !composerText.value.trim()) {
          composerEl.classList.remove('expanded');
        }
      });
    }

    // ── Publicar nuevo post ──
    async function publicar() {
      const txt = document.getElementById('composer-text').value;
      const btn = document.getElementById('composer-btn');
      const cat = getFiltroActual ? getFiltroActual() : 'general';

      if (!txt.trim() && !imagenPendiente) { toast('⚠️ Escribe algo o adjunta una imagen'); return; }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Publicando...';

      let urlImagen = null;

      // Si hay imagen, subirla directamente como File
      if (imagenPendiente) {
        try {
          const { subirImagenComunidad } = await import('../assets/js/storage.js?v=20260809');
          const { url, error: errSub } = await subirImagenComunidad(imagenPendiente);
          if (errSub) {
            toast('⚠️ Error al subir imagen: ' + errSub);
            btn.disabled = false;
            btn.innerHTML = 'Publicar →';
            return;
          }
          urlImagen = url;
        } catch (e) {
          toast('⚠️ Error inesperado con la imagen');
          btn.disabled = false;
          btn.innerHTML = 'Publicar →';
          return;
        }
      }

      const { error } = await crearPost(txt, cat, liveActivo, urlImagen);
      btn.disabled = false;
      btn.innerHTML = 'Publicar →';

      if (!error) {
        document.getElementById('composer-text').value = '';
        window.__quitarImagen();
        if (liveActivo) { liveActivo = false; toggleLive(); }
        // OPTIMIZACIÓN: antes recargábamos TODO el feed (cargarFeed con reset)
        // cada vez que alguien publicaba. Eso era innecesario porque el Realtime
        // ya trae el post nuevo automáticamente a los demás usuarios.
        // El autor del post no necesita recargar: su post aparece vía Realtime
        // (el trigger INSERT en la tabla posts lo dispara).
        // Si el Realtime fallara, el usuario puede hacer pull-to-refresh.
      }
    }
    window.publicar = publicar;

    // ── Filtrar ──
    function filtrarCat(cat, btn) {
      document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
      if (btn) btn.classList.add('active');
      filtrar(cat);
    }
    window.filtrarCat = filtrarCat;
  </script>
</body>
</html>

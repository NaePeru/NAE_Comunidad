<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificar Certificado — NAE</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/base.css?v=20240710v1">
  <link rel="stylesheet" href="assets/css/components.css?v=20240710v1">

  <style>
    body {
      background: linear-gradient(160deg, #0a0e1a 0%, #0d1525 50%, #0a1a3d 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .verify-box {
      max-width: 520px;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 40px 32px;
      text-align: center;
    }

    .verify-logo {
      font-size: 28px;
      font-weight: 800;
      color: var(--gold);
      margin-bottom: 8px;
    }

    .verify-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .verify-sub {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 28px;
    }

    .verify-input-wrap {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .verify-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      font-family: var(--font-mono);
      font-size: 14px;
      text-transform: uppercase;
      color: var(--text);
      letter-spacing: 0.05em;
    }

    .verify-input:focus {
      outline: none;
      border-color: var(--gold);
    }

    .verify-hint {
      font-size: 11px;
      color: var(--muted2);
      margin-bottom: 20px;
    }

    /* ── Resultado ── */
    .verify-result {
      display: none;
      margin-top: 24px;
      padding: 24px;
      border-radius: var(--radius);
      text-align: left;
    }

    .verify-result.valido {
      display: block;
      background: rgba(34, 197, 94, 0.08);
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .verify-result.invalido {
      display: block;
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.3);
      text-align: center;
    }

    .verify-result-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      font-weight: 700;
      font-size: 16px;
    }

    .verify-result.valido .verify-result-head { color: #4ade80; }
    .verify-result.invalido .verify-result-head { color: #f87171; }

    .verify-field {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }

    .verify-field:last-child { border-bottom: none; }

    .verify-field-label {
      color: var(--muted);
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.04em;
    }

    .verify-field-value {
      font-weight: 600;
      color: var(--text);
    }

    .verify-spinner {
      width: 24px;
      height: 24px;
      border: 3px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Certificado visual HTML (réplica del PDF) ── */
    .cert-visual {
      background: #fff;
      border: 3px solid #466EB4;
      border-radius: 8px;
      padding: 40px 36px 32px;
      position: relative;
      color: #1a1a1a;
      font-family: Georgia, 'Times New Roman', serif;
      box-shadow: 0 4px 24px rgba(70, 110, 180, 0.15);
    }

    .cert-visual::before {
      content: '';
      position: absolute;
      top: 8px; left: 8px; right: 8px; bottom: 8px;
      border: 1px solid #96AFD7;
      border-radius: 4px;
      pointer-events: none;
    }

    .cert-vis-header {
      text-align: center;
      border-bottom: 1px solid #466EB4;
      padding-bottom: 16px;
      margin-bottom: 24px;
    }

    .cert-vis-logo {
      font-size: 22px;
      font-weight: 700;
      color: #466EB4;
      letter-spacing: 0.05em;
    }

    .cert-vis-sub {
      font-size: 11px;
      color: #666;
      margin-top: 2px;
      font-family: Arial, sans-serif;
      letter-spacing: 0.03em;
    }

    .cert-vis-inst {
      font-size: 10px;
      color: #999;
      margin-top: 2px;
      font-family: Arial, sans-serif;
    }

    .cert-vis-title {
      text-align: center;
      font-size: 13px;
      color: #777;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-bottom: 4px;
      font-family: Arial, sans-serif;
    }

    .cert-vis-title-big {
      text-align: center;
      font-size: 30px;
      font-weight: 700;
      color: #2a2a2a;
      margin-bottom: 2px;
    }

    .cert-vis-title-sub {
      text-align: center;
      font-size: 13px;
      color: #888;
      letter-spacing: 0.1em;
      margin-bottom: 24px;
      font-family: Arial, sans-serif;
    }

    .cert-vis-otorgado {
      text-align: center;
      font-size: 13px;
      color: #999;
      font-family: Arial, sans-serif;
      margin-bottom: 4px;
    }

    .cert-vis-nombre {
      text-align: center;
      font-size: 26px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 4px;
      letter-spacing: 0.02em;
    }

    .cert-vis-dni {
      text-align: center;
      font-size: 13px;
      color: #888;
      font-family: Arial, sans-serif;
      margin-bottom: 20px;
    }

    .cert-vis-programa-label {
      text-align: center;
      font-size: 13px;
      color: #666;
      font-family: Arial, sans-serif;
      margin-bottom: 4px;
    }

    .cert-vis-programa {
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      color: #466EB4;
      margin-bottom: 22px;
    }

    .cert-vis-pills {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }

    .cert-vis-pill {
      background: #F0F4FC;
      border: 1px solid #466EB4;
      border-radius: 16px;
      padding: 6px 16px;
      font-size: 12px;
      color: #3C5A96;
      font-family: Arial, sans-serif;
    }

    .cert-vis-firmas {
      display: flex;
      justify-content: space-around;
      margin-top: 16px;
      gap: 30px;
    }

    .cert-vis-firma {
      text-align: center;
      flex: 1;
      max-width: 200px;
    }

    .cert-vis-firma-line {
      border-top: 1px solid #555;
      margin-bottom: 6px;
    }

    .cert-vis-firma-nombre {
      font-size: 14px;
      font-weight: 700;
      color: #2a2a2a;
      font-family: Arial, sans-serif;
    }

    .cert-vis-firma-cargo {
      font-size: 11px;
      color: #888;
      font-family: Arial, sans-serif;
      margin-top: 2px;
    }

    .cert-vis-codigo {
      text-align: center;
      margin-top: 24px;
      padding-top: 14px;
      border-top: 1px solid #ddd;
    }

    .cert-vis-codigo-text {
      font-size: 11px;
      color: #999;
      font-family: 'JetBrains Mono', monospace;
    }

    .cert-vis-verificado {
      text-align: center;
      margin-top: 16px;
    }

    .cert-vis-verificado-badge {
      display: inline-block;
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #22c55e;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 14px;
      border-radius: 20px;
      font-family: Arial, sans-serif;
    }

    @media (max-width: 520px) {
      .cert-vis-title-big { font-size: 24px; }
      .cert-vis-nombre { font-size: 20px; }
      .cert-vis-programa { font-size: 18px; }
      .cert-vis-firmas { flex-direction: column; gap: 16px; }
      .cert-vis-pills { gap: 6px; }
      .cert-vis-pill { font-size: 11px; padding: 5px 12px; }
    }
  </style>
</head>
<body>

  <div class="verify-box">
    <div class="verify-logo">◆ NAE</div>
    <div class="verify-title">Verificación de Certificado</div>
    <div class="verify-sub">Centro de Capacitación NAE</div>

    <div class="verify-input-wrap">
      <input type="text" class="verify-input" id="codigo-input"
        placeholder="NAE-2026-XXXXX" maxlength="20">
      <button class="btn btn-primary" id="btn-verificar" onclick="window.__verificar()">
        Verificar
      </button>
    </div>
    <div class="verify-hint">Ingresá el código que aparece en el certificado</div>

    <div id="verify-loading" style="display:none;">
      <div class="verify-spinner"></div>
    </div>

    <div id="verify-result"></div>
  </div>

  <script type="module">
    import { supabase } from './assets/js/supabase-client.js';

    window.__verificar = async function() {
      const input = document.getElementById('codigo-input');
      const codigo = input.value.trim().toUpperCase();
      const loading = document.getElementById('verify-loading');
      const result = document.getElementById('verify-result');
      const btn = document.getElementById('btn-verificar');

      if (!codigo) return;

      btn.disabled = true;
      loading.style.display = 'block';
      result.className = '';
      result.innerHTML = '';

      try {
        const { data, error } = await supabase.rpc('verificar_certificado', { p_codigo: codigo });

        loading.style.display = 'none';
        btn.disabled = false;

        if (error) throw error;

        // La RPC devuelve un array (tabla); tomar el primer elemento
        const cert = Array.isArray(data) ? data[0] : data;

        if (cert && cert.codigo) {
          // Certificado válido — mostrar en formato visual HTML
          const fechaStr = new Date(cert.emitido_en).toLocaleDateString('es-PE', {
            day: '2-digit', month: 'long', year: 'numeric',
          });

          result.className = 'verify-result valido';
          result.style.padding = '0';
          result.style.background = 'transparent';
          result.style.border = 'none';
          result.innerHTML = `
            <div class="cert-vis-verificado">
              <span class="cert-vis-verificado-badge">✅ Certificado verificado y válido</span>
            </div>
            <div class="cert-visual" style="margin-top:16px;">
              <div class="cert-vis-header">
                <div class="cert-vis-logo">◆ NAE</div>
                <div class="cert-vis-sub">NEW ACADEMY EXCEL</div>
                <div class="cert-vis-inst">Centro de Capacitación NAE · Comunidad Virtual de Análisis de Datos</div>
              </div>

              <div class="cert-vis-title">Certificado</div>
              <div class="cert-vis-title-big">DE APROBACIÓN</div>
              <div class="cert-vis-title-sub">&nbsp;</div>

              <div class="cert-vis-otorgado">Otorgado a:</div>
              <div class="cert-vis-nombre">${cert.nombre_emisor}</div>
              <div class="cert-vis-dni">${cert.dni ? 'DNI: ' + cert.dni : ''}</div>

              <div class="cert-vis-programa-label">Por completar satisfactoriamente el programa de:</div>
              <div class="cert-vis-programa">${cert.titulo}</div>

              <div class="cert-vis-pills">
                <span class="cert-vis-pill">⏱ ${cert.horas} horas</span>
                <span class="cert-vis-pill">💻 Modalidad ${cert.modalidad}</span>
                <span class="cert-vis-pill">📅 ${fechaStr}</span>
              </div>

              <div class="cert-vis-firmas">
                <div class="cert-vis-firma">
                  <div class="cert-vis-firma-line"></div>
                  <div class="cert-vis-firma-nombre">Geronimo Cruzado</div>
                  <div class="cert-vis-firma-cargo">Analista de Datos</div>
                </div>
                <div class="cert-vis-firma">
                  <div class="cert-vis-firma-line"></div>
                  <div class="cert-vis-firma-nombre">Jhonny Vasquez C.</div>
                  <div class="cert-vis-firma-cargo">Arquitecto de Datos</div>
                </div>
              </div>

              <div class="cert-vis-codigo">
                <div class="cert-vis-codigo-text">Código de verificación: ${cert.codigo}</div>
              </div>
            </div>
          `;
        } else {
          // No encontrado
          result.className = 'verify-result invalido';
          result.innerHTML = `
            <div class="verify-result-head">
              <span style="font-size:24px;">❌</span>
              Certificado no encontrado
            </div>
            <p style="font-size:13px;color:var(--muted);margin-top:8px;">
              El código <strong style="font-family:var(--font-mono);">${codigo}</strong> no corresponde a ningún certificado válido emitido por NAE.
            </p>
          `;
        }
      } catch (err) {
        loading.style.display = 'none';
        btn.disabled = false;
        result.className = 'verify-result invalido';
        result.innerHTML = `
          <div class="verify-result-head">
            <span style="font-size:24px;">⚠️</span>
            Error de verificación
          </div>
          <p style="font-size:13px;color:var(--muted);margin-top:8px;">
            No se pudo verificar en este momento. Intentá nuevamente más tarde.
          </p>
        `;
      }
    };

    // Permitir Enter en el input
    document.getElementById('codigo-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') window.__verificar();
    });

    // Si hay un código en la URL (?codigo=XXX), verificar automáticamente
    const params = new URLSearchParams(window.location.search);
    const codigoUrl = params.get('codigo');
    if (codigoUrl) {
      document.getElementById('codigo-input').value = codigoUrl.toUpperCase();
      window.__verificar();
    }
  </script>
</body>
</html>

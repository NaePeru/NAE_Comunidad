<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificar Certificado — NAE</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/base.css?v=20240710v1">
  <link rel="stylesheet" href="assets/css/components.css?v=20240710v1">

  <style>
    body {
      background: linear-gradient(160deg, #0a0e1a 0%, #0d1525 50%, #0a1a3d 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .verify-box {
      max-width: 520px;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 40px 32px;
      text-align: center;
    }

    .verify-logo {
      font-size: 28px;
      font-weight: 800;
      color: var(--gold);
      margin-bottom: 8px;
    }

    .verify-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .verify-sub {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 28px;
    }

    .verify-input-wrap {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .verify-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      font-family: var(--font-mono);
      font-size: 14px;
      text-transform: uppercase;
      color: var(--text);
      letter-spacing: 0.05em;
    }

    .verify-input:focus {
      outline: none;
      border-color: var(--gold);
    }

    .verify-hint {
      font-size: 11px;
      color: var(--muted2);
      margin-bottom: 20px;
    }

    /* ── Resultado ── */
    .verify-result {
      display: none;
      margin-top: 24px;
      padding: 24px;
      border-radius: var(--radius);
      text-align: left;
    }

    .verify-result.valido {
      display: block;
      background: rgba(34, 197, 94, 0.08);
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .verify-result.invalido {
      display: block;
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.3);
      text-align: center;
    }

    .verify-result-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      font-weight: 700;
      font-size: 16px;
    }

    .verify-result.valido .verify-result-head { color: #4ade80; }
    .verify-result.invalido .verify-result-head { color: #f87171; }

    .verify-field {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }

    .verify-field:last-child { border-bottom: none; }

    .verify-field-label {
      color: var(--muted);
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.04em;
    }

    .verify-field-value {
      font-weight: 600;
      color: var(--text);
    }

    .verify-spinner {
      width: 24px;
      height: 24px;
      border: 3px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="verify-box">
    <div class="verify-logo">◆ NAE</div>
    <div class="verify-title">Verificación de Certificado</div>
    <div class="verify-sub">Centro de Capacitación NAE</div>

    <div class="verify-input-wrap">
      <input type="text" class="verify-input" id="codigo-input"
        placeholder="NAE-2026-XXXXX" maxlength="20">
      <button class="btn btn-primary" id="btn-verificar" onclick="window.__verificar()">
        Verificar
      </button>
    </div>
    <div class="verify-hint">Ingresá el código que aparece en el certificado</div>

    <div id="verify-loading" style="display:none;">
      <div class="verify-spinner"></div>
    </div>

    <div id="verify-result"></div>
  </div>

  <script type="module">
    import { supabase } from './assets/js/supabase-client.js';

    window.__verificar = async function() {
      const input = document.getElementById('codigo-input');
      const codigo = input.value.trim().toUpperCase();
      const loading = document.getElementById('verify-loading');
      const result = document.getElementById('verify-result');
      const btn = document.getElementById('btn-verificar');

      if (!codigo) return;

      btn.disabled = true;
      loading.style.display = 'block';
      result.className = '';
      result.innerHTML = '';

      try {
        const { data, error } = await supabase.rpc('verificar_certificado', { p_codigo: codigo });

        loading.style.display = 'none';
        btn.disabled = false;

        if (error) throw error;

        if (data && data.codigo) {
          // Certificado válido
          const fechaStr = new Date(data.emitido_en).toLocaleDateString('es-PE', {
            day: '2-digit', month: 'long', year: 'numeric',
          });

          result.className = 'verify-result valido';
          result.innerHTML = `
            <div class="verify-result-head">
              <span style="font-size:24px;">✅</span>
              Certificado Válido
            </div>
            <div class="verify-field">
              <span class="verify-field-label">Nombre</span>
              <span class="verify-field-value">${data.nombre_emisor}</span>
            </div>
            <div class="verify-field">
              <span class="verify-field-label">DNI</span>
              <span class="verify-field-value">${data.dni || '—'}</span>
            </div>
            <div class="verify-field">
              <span class="verify-field-label">Programa</span>
              <span class="verify-field-value">${data.titulo}</span>
            </div>
            <div class="verify-field">
              <span class="verify-field-label">Horas</span>
              <span class="verify-field-value">${data.horas} horas</span>
            </div>
            <div class="verify-field">
              <span class="verify-field-label">Modalidad</span>
              <span class="verify-field-value">${data.modalidad}</span>
            </div>
            <div class="verify-field">
              <span class="verify-field-label">Fecha de emisión</span>
              <span class="verify-field-value">${fechaStr}</span>
            </div>
            <div class="verify-field">
              <span class="verify-field-label">Código</span>
              <span class="verify-field-value" style="font-family:var(--font-mono);">${data.codigo}</span>
            </div>
          `;
        } else {
          // No encontrado
          result.className = 'verify-result invalido';
          result.innerHTML = `
            <div class="verify-result-head">
              <span style="font-size:24px;">❌</span>
              Certificado no encontrado
            </div>
            <p style="font-size:13px;color:var(--muted);margin-top:8px;">
              El código <strong style="font-family:var(--font-mono);">${codigo}</strong> no corresponde a ningún certificado válido emitido por NAE.
            </p>
          `;
        }
      } catch (err) {
        loading.style.display = 'none';
        btn.disabled = false;
        result.className = 'verify-result invalido';
        result.innerHTML = `
          <div class="verify-result-head">
            <span style="font-size:24px;">⚠️</span>
            Error de verificación
          </div>
          <p style="font-size:13px;color:var(--muted);margin-top:8px;">
            No se pudo verificar en este momento. Intentá nuevamente más tarde.
          </p>
        `;
      }
    };

    // Permitir Enter en el input
    document.getElementById('codigo-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') window.__verificar();
    });

    // Si hay un código en la URL (?codigo=XXX), verificar automáticamente
    const params = new URLSearchParams(window.location.search);
    const codigoUrl = params.get('codigo');
    if (codigoUrl) {
      document.getElementById('codigo-input').value = codigoUrl.toUpperCase();
      window.__verificar();
    }
  </script>
</body>
</html>
